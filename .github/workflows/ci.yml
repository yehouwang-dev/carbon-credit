name: Build and contract checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            hardhat-project/package-lock.json
            fronted/package-lock.json
      - name: Install contract dependencies
        working-directory: hardhat-project
        run: npm ci
      - name: Compile and check contracts
        working-directory: hardhat-project
        run: npm test
      - name: Install frontend dependencies
        working-directory: fronted
        run: npm ci
      - name: Build frontend
        working-directory: fronted
        run: npm run build
      - name: Check browser-only simulation model
        working-directory: fronted
        run: npm test
      - name: Check certificate acceptance and regression
        working-directory: fronted
        run: npm run test:acceptance
      - name: Check high-severity frontend advisories
        working-directory: fronted
        run: npm audit --audit-level=high
      - name: Check high-severity tooling advisories
        working-directory: hardhat-project
        run: npm audit --audit-level=high
      - name: Build Sepolia frontend shell
        working-directory: fronted
        run: VITE_NETWORK=sepolia npm run build:sepolia
